  const result=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('timeout')),45000);try{tg.requestContact((shared,event)=>{clearTimeout(timer);resolve({shared,event})})}catch(e){clearTimeout(timer);reject(e)}});

}

function fitTextarea(field){

  field.style.height='0px';field.value=field.placeholder||' ';

  field.value=value;
  if(document.activeElement===field&&typeof field.setSelectionRange==='function')field.setSelectionRange(start,end);
 }

}

 }finally{S=current}

function commitEdgeBack(distance,width){return distance>=width*.35}
const edgeBack=(()=>{
 const app=$('#app');
 let drag=null,stage=null,front=null,rear=null,shade=null,timer=null,suppressUntil=0;
 const stripIds=el=>{el.removeAttribute('id');el.querySelectorAll('[id]').forEach(n=>{if(inTg&&n.id==='bk')n.hidden=true;n.removeAttribute('id')});return el};
 function cancel(){
  clearTimeout(timer);timer=null;
  if(stage)stage.remove();
  app.classList.remove('edge-dragging');
  drag=stage=front=rear=shade=null;
 }
 function frame(main,footer){
  const page=document.createElement('div');page.className='edge-page';page.inert=true;
  page.append(main,footer);return page;
 }
 function prepare(){
  const preview=backPreview(),view=$('#view');
  const previous=document.createElement('main');previous.innerHTML=preview.html;stripIds(previous);
  const footer=stripIds($(preview.wizard?'#dock':'#tabs').cloneNode(true));footer.hidden=false;
  if(preview.wizard)footer.querySelector('button').textContent=preview.step===0?'Далее: адрес':'Далее: контакт';
  else footer.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===preview.tab));
  rear=frame(previous,footer);
  const visible=stripIds(view.cloneNode(true));
  front=frame(visible,stripIds($(S.w||S.tab==='done'?'#dock':'#tabs').cloneNode(true)));
  front.classList.add('front');
  shade=document.createElement('div');shade.className='edge-shade';rear.append(shade);
  stage=document.createElement('div');stage.className='edge-stage';stage.setAttribute('aria-hidden','true');stage.append(rear,front);app.append(stage);
  visible.scrollTop=view.scrollTop;
  app.classList.add('edge-dragging');move(0);
 }
 function move(x){
  const progress=x/drag.width;
  front.style.transform=`translate3d(${x}px,0,0)`;
  rear.style.transform=`translate3d(${(x-drag.width)*.24}px,0,0)`;
  shade.style.opacity=String(.18*(1-progress));
 }
 function finish(commit){
  if(!stage){cancel();return}
  drag.settling=true;suppressUntil=performance.now()+450;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const duration=reduce?0:220;
  front.style.transition=rear.style.transition=`transform ${duration}ms cubic-bezier(.2,.75,.25,1)`;
  shade.style.transition=`opacity ${duration}ms ease`;
  move(commit?drag.width:0);
  timer=setTimeout(()=>{cancel();if(commit)back(false)},duration);
 }
 app.addEventListener('touchstart',e=>{
  if(drag||S.sending||S.preparing||S.discussing||S.sheet||(!S.w&&S.tab!=='done')||e.touches.length!==1)return;
  const t=e.touches[0],bounds=app.getBoundingClientRect();
  if(t.clientX<bounds.left||t.clientX>bounds.left+28||t.clientY<bounds.top||t.clientY>bounds.bottom)return;
  if(e.target.closest('input,textarea,select,.days'))return;
  drag={id:t.identifier,x:t.clientX,y:t.clientY,width:bounds.width,distance:0,active:false,settling:false};
 },{passive:true});
 app.addEventListener('touchmove',e=>{
  if(!drag||drag.settling)return;
  if(e.touches.length!==1){cancel();return}
  const t=[...e.touches].find(t=>t.identifier===drag.id);if(!t)return;
  const dx=t.clientX-drag.x,dy=t.clientY-drag.y;
  if(!drag.active){
   if(Math.abs(dy)>8&&Math.abs(dy)>=Math.abs(dx)){cancel();return}
   if(dx< -8){cancel();return}
   if(dx<8||dx<Math.abs(dy)*1.2)return;
   if(!e.cancelable){cancel();return}
   drag.active=true;prepare();
  }
  if(e.cancelable)e.preventDefault();
  drag.distance=Math.max(0,Math.min(drag.width,dx));move(drag.distance);
 },{passive:false});
 app.addEventListener('touchend',e=>{
  if(!drag||drag.settling)return;
  if(![...e.changedTouches].some(t=>t.identifier===drag.id))return;
  if(!drag.active){cancel();return}
  if(e.cancelable)e.preventDefault();
  finish(commitEdgeBack(drag.distance,drag.width));
 },{passive:false});
 app.addEventListener('touchcancel',()=>{if(drag?.active&&!drag.settling)finish(false);else cancel()},{passive:true});
 app.addEventListener('click',e=>{if(performance.now()<suppressUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
 window.addEventListener('resize',cancel);
