.photo-stub-icon{position:relative;display:grid;place-items:center;width:54px;height:54px;border-radius:13px;background:var(--bg)}
.photo-stub-icon>svg:last-child{position:absolute;bottom:4px;right:4px;width:14px;height:14px;background:var(--card);border-radius:50%}
.photo-stub b{display:block;font-size:14px;font-weight:500}.photo-stub small{display:block;font-size:12px;margin-top:4px}

[data-t=light]{color-scheme:light}
[data-t=dark]{color-scheme:dark}
.tabs,.dock{flex-shrink:0}
@media(max-height:740px){
 .hrow h1{font-size:28px}
 .home-section{margin-top:20px;margin-bottom:10px}
 .svc{min-height:120px;padding:13px}
 .svc .ib{width:38px;height:38px;border-radius:12px;margin-bottom:12px}
 .svc .ib svg{width:22px;height:22px}
 .svc small{font-size:13px}
}

.edge-stage{position:absolute;top:calc(var(--app-safe-top) + var(--app-content-top));right:var(--app-safe-right);bottom:0;left:var(--app-safe-left);z-index:8;overflow:hidden;pointer-events:none;background:var(--bg)}
.edge-page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform;animation:none!important}
.edge-page>main{flex:1;min-height:0;overflow:hidden;padding:14px 16px 24px;background:var(--bg);animation:none!important}
.edge-page.front{box-shadow:-8px 0 24px rgba(0,0,0,.17)}
.edge-shade{position:absolute;inset:0;background:#000;opacity:.18;pointer-events:none}
.edge-page input,.edge-page textarea{caret-color:transparent}
#app.edge-dragging>#view,#app.edge-dragging>#dock,#app.edge-dragging>#tabs{visibility:hidden}
#view:focus{outline:none}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.photo-item,.photo-add{aspect-ratio:1;border-radius:15px;position:relative;overflow:hidden;background:var(--card)}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-item button{position:absolute;right:5px;top:5px;border-radius:50%;background:#0f1b2acc;color:#fff;width:27px;height:27px;display:grid;place-items:center}
.photo-item button svg{width:15px;height:15px}.photo-add{border:1px dashed var(--mut);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--mut);font-size:12px}
#go:disabled{opacity:.6}

.order-status-panel{padding:20px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:16px}
.order-status-panel h2{font-size:21px;letter-spacing:-.4px}.order-status-panel>p{font-size:13px;color:var(--mut);line-height:1.5;margin-top:8px}
.order-progress{display:flex;margin:24px -7px 16px}.order-progress>div{flex:1;text-align:center;position:relative;min-width:0}
.order-progress i{position:relative;z-index:1;display:grid;place-items:center;width:20px;height:20px;background:var(--bg);border:2px solid var(--line);border-radius:50%;margin:0 auto 9px;font-style:normal;font-size:11px;color:var(--accx)}
.order-progress>div:not(:last-child):after{content:'';position:absolute;top:9px;left:50%;width:100%;height:2px;background:var(--line)}
.order-progress .reached i{background:var(--acc);border-color:var(--acc)}.order-progress .reached:not(.current):after{background:var(--acc)}
.order-progress b{display:block;font-size:9px;font-weight:500;color:var(--mut)}.order-progress .reached b{color:var(--ink)}.order-progress small{display:block;font-size:8px;color:var(--mut);line-height:1.5;margin-top:5px}
.status-updated{display:block;font-size:11px;color:var(--mut)}.cancelled h2,.status.cancelled{color:#cf6559}.sync-note{display:block;font-size:12px;color:var(--mut);padding:0 3px 15px;text-align:left}

.native-photo-picker{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.photo-add{cursor:pointer}.photo-add:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
.photo-add[aria-disabled=true]{opacity:.6;cursor:wait}
</style>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <input id="photo-input" class="native-photo-picker" tabindex="-1" type="file" accept="image/*" multiple aria-label="Добавить фотографии">
  <div class="dock" id="dock" hidden><button id="go"></button></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="layer"><div class="scrim" data-a="close"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" inert></div></div>
</div>
<script>
// iOS WebViews may ignore viewport zoom limits; block multi-touch zoom only.
for(const event of ['gesturestart','gesturechange','gestureend']){
 document.addEventListener(event,e=>e.preventDefault(),{passive:false});
}
document.addEventListener('touchmove',e=>{
 if(e.touches.length>1)e.preventDefault();
},{passive:false});
const tg = window.Telegram && window.Telegram.WebApp, inTg = !!(tg && (tg.initData || (tg.platform && tg.platform !== 'unknown')));
const systemTheme=matchMedia('(prefers-color-scheme: dark)');
function syncTheme(){
 const dark=inTg?tg.colorScheme==='dark':systemTheme.matches;
 document.documentElement.dataset.t=dark?'dark':'light';
 if(inTg){
  const bg=dark?'#0a1119':'#f3f4f6';
  try{tg.setHeaderColor(bg)}catch(e){}
  try{tg.setBackgroundColor(bg)}catch(e){}
  try{tg.setBottomBarColor(dark?'#131d28':'#ffffff')}catch(e){}
 }
}
if(inTg){
 document.documentElement.classList.add('tg');
 tg.ready();tg.expand();
 try{tg.disableVerticalSwipes();tg.MainButton.hide()}catch(e){}
 tg.onEvent('themeChanged',syncTheme);
}else if(systemTheme.addEventListener){systemTheme.addEventListener('change',syncTheme)}
syncTheme();
// Keep fallback insets current on clients that expose the JS API before CSS variables.
function syncSafeArea(){
 if(!inTg)return;
 const root=document.documentElement.style;
 const system=tg.safeAreaInset||{},content=tg.contentSafeAreaInset||{};
 for(const edge of ['top','bottom','left','right']){
  root.setProperty('--vg-safe-'+edge,Math.max(0,Number(system[edge])||0)+'px');
  root.setProperty('--vg-content-'+edge,Math.max(0,Number(content[edge])||0)+'px');
 }
}
if(inTg){
 syncSafeArea();
 for(const event of ['safeAreaChanged','contentSafeAreaChanged','fullscreenChanged','viewportChanged'])tg.onEvent(event,syncSafeArea);
}
const hap = (k) => { try { k ? tg.HapticFeedback.notificationOccurred(k) : tg.HapticFeedback.selectionChanged(); } catch(e){} };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const P = {
 trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6', flat:'M3 11 12 4l9 7M5 10v10h14V10M10 20v-6h4v6',
 office:'M5 21V4h9v17M14 9h5v12M8 8h3M8 12h3M8 16h3M3 21h18', load:'M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8',
 rig:'M4 21V4h10M4 8l10-4M14 4v8M12 12h4v3a2 2 0 1 1-4 0zM2 21h9', dem:'M13 4l7 7-3 3-7-7zM11 8 3 16l3 3 8-8',
 chev:'M9 6l6 6-6 6', back:'M15 6l-6 6 6 6', x:'M6 6l12 12M18 6 6 18', plus:'M12 5v14M5 12h14', pin:'M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11zM12 12a2 2 0 1 0 0-.01',
 cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2', phone:'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2',
 send:'M21 4 3 11l7 3 3 7zM10 14l11-10', chat:'M4 5h16v11H9l-5 4z', check:'M5 12l5 5 9-10', list:'M6 3h12v18H6zM9 8h6M9 12h6M9 16h4', truck:'M2 6h12v10H2zM14 9h4l4 4v3h-8M6 19a1.5 1.5 0 1 0 0-.01M17 19a1.5 1.5 0 1 0 0-.01',
 user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0', cam:'M4 8h4l2-3h4l2 3h4v12H4zM12 17a3.5 3.5 0 1 0 0-.01', sun:'M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 2v2M12 20v2M2 12h2M20 12h2'
};
const ic = k => `<svg viewBox="0 0 24 24"><path d="${P[k]}"/></svg>`;

// До согласования тарифов стоимость рассчитывает менеджер.
const SV = [
 {id:'trash',r:85,n:'Вывоз мусора',c:'#ff8a3d',d:'Стройка, мебель, дача',q:'Что нужно вывезти?',ph:'Например: старый диван и 10 мешков после ремонта'},
 {id:'flat',r:55,n:'Квартирный переезд',c:'#3d8bff',d:'Вещи, мебель и техника',mv:1,q:'Что нужно перевезти?',ph:'Например: вещи из однокомнатной квартиры, диван и холодильник'},
 {id:'office',r:105,n:'Офисный переезд',c:'#7a5cff',d:'Мебель, техника, архив',mv:1,q:'Что нужно перевезти?',ph:'Например: 8 рабочих мест, шкафы с документами и оргтехника'},
 {id:'load',r:45,n:'Услуги грузчиков',c:'#19b36b',d:'Погрузка и разгрузка',q:'С чем нужна помощь?',ph:'Например: поднять холодильник и стиральную машину на 4-й этаж'},
 {id:'rig',r:50,n:'Такелаж',c:'#d99a00',d:'Тяжёлое и крупное',q:'Что нужно переместить?',ph:'Например: сейф около 300 кг, с первого этажа в машину'},
 {id:'dem',r:0,n:'Демонтаж',c:'#ff4d6d',d:'Разобрать и вывезти',q:'Что нужно разобрать?',ph:'Например: разобрать кухню и вывезти старые шкафы'}];
const SLOTS = [['По согласованию','уточним вместе','chat'],['Утро','8:00–12:00','sun'],['День','12:00–17:00','clock'],['Вечер','17:00–21:00','clock']];
const sv = id => SV.find(s => s.id === id) || SV[0];
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const plus = n => { const d = new Date(); d.setDate(d.getDate()+n); return d; };
const today = () => iso(new Date());
const fd = (s, long) => !s ? 'По согласованию' : new Date(s+'T12:00').toLocaleDateString('ru-RU', long ? {weekday:'long', day:'numeric', month:'long'} : {day:'numeric', month:'long'});
const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const API_BASE=String(window.VG_CONFIG?.apiBase||'').replace(/\/$/,'');
const photoCache=new Map();
let S = {tab:'home', w:null, step:0, last:null, sheet:null, cal:null, anim:'', orders:[], errors:{},sending:false,preparing:false,photoError:'',submitError:''};
try {
 const current=localStorage.getItem('vg-requests-v2');
 if(current){const o=JSON.parse(current);if(Array.isArray(o))S.orders=o}
 else {const old=JSON.parse(localStorage.getItem('vg-orders')||'[]');if(Array.isArray(old))S.orders=old.map(o=>({...o,status:'draft',step:0,toFloor:1,toLift:true,slot:Math.max(0,SLOTS.findIndex(s=>s[0]===o.slot))}))}
} catch(e){}
const newW = id => ({photos:[],sv:id||'trash',desc:'',addr:'',to:'',floor:1,lift:true,toFloor:1,toLift:true,dis:false,date:'',slot:0,name:user?user.first_name:'',phone:''});
function save(){try{localStorage.setItem('vg-requests-v2',JSON.stringify(S.orders));return true}catch(e){return false}}
const TABS = [['home','Заказ','truck'],['orders','Заявки','list']];
$('#tabs').innerHTML = TABS.map(t => `<button data-a="tab" data-v="${t[0]}">${ic(t[2])}${t[1]}</button>`).join('');
if (inTg) tg.BackButton.onClick(back);
function back(animated=true){if(S.sending||S.preparing)return;hap();if(S.sheet)return close();S.errors={};S.anim=animated===false?'':'ab';if(S.w&&S.step>0)S.step--;else{if(S.w&&(S.w.desc.trim()||S.w.addr.trim()))storeDraft();const wasDone=S.tab==='done';S.w=null;S.tab=wasDone?'orders':'home'}render()}
function home(){
 const draft=S.orders.find(o=>o.status==='draft');
 return `<div class="hrow"><h1>Что нужно вывезти<br>или перевезти?</h1></div>
 ${draft?`<button class="quick-row resume" data-a="open-request" data-v="${esc(draft.id)}">${ic('list')}<div><b>Продолжить заказ</b><small>${esc(sv(draft.sv).n)}</small></div>${ic('chev')}</button>`:''}
 <div class="sec home-section"><b>Услуги</b><small>цена за час</small></div>
 <div class="grid">${SV.map(s=>`<button class="svc" style="--c:${s.c}" data-a="start" data-v="${s.id}"><span class="bg">${ic(s.id)}</span><span class="ib">${ic(s.id)}</span><b>${s.n}</b><small>${s.r?'от '+s.r+' BYN':'по оценке'}</small></button>`).join('')}</div>`;
}
const error = key => `<p class="error" id="err-${key}" role="alert">${esc(S.errors[key]||'')}</p>`;
const addressField=(key,label,placeholder)=>`<label class="field-label" for="${key}">${label}</label><div class="fld ${S.errors[key]?'invalid':''}">${ic('pin')}<input id="${key}" data-f="${key}" maxlength="220" autocomplete="street-address" aria-describedby="err-${key}" aria-invalid="${!!S.errors[key]}" placeholder="${placeholder}" value="${esc(S.w[key])}"></div>${error(key)}`;
function conditions(prefix,title){const w=S.w,f=prefix?'toFloor':'floor',l=prefix?'toLift':'lift';return `<p class="conditions-title">${title}</p><div class="card conditions"><div class="rw"><span>Этаж</span><div class="stp"><button data-a="fl" data-k="${f}" data-v="-1" aria-label="Уменьшить этаж" ${w[f]<=1?'disabled':''}>−</button><b>${w[f]}</b><button data-a="fl" data-k="${f}" data-v="1" aria-label="Увеличить этаж" ${w[f]>=50?'disabled':''}>+</button></div></div><div class="rw"><span>Есть лифт</span><button class="sw" role="switch" aria-checked="${w[l]}" aria-label="Есть лифт: ${title}" data-a="tgl" data-k="${l}"></button></div></div>`}
function wizard(){
 const w=S.w,s=sv(w.sv),seg=[0,1,2].map(i=>`<i class="${i<=S.step?'on':''}"></i>`).join('');
 const bar=`<div class="bar"><button id="bk" data-a="back" aria-label="Назад">${ic('back')}</button><div class="seg">${seg}</div></div><p class="step-label">Шаг ${S.step+1} из 3 · ${['Задача','Место и время','Контакт'][S.step]}</p>`;
 if(S.step===0)return bar+`<div class="hd"><h1>${s.q}</h1><p class="sub">Коротко: что и сколько.</p></div>
 <button class="pill" style="--c:${s.c}" data-a="sheet" data-v="svc"><span class="ib sm">${ic(s.id)}</span><b>${s.n}</b><em>Изменить</em></button>
 <label class="field-label" for="desc">Что и примерно сколько? <span style="font-weight:400;color:var(--mut)">· необязательно</span></label><div class="card input-card"><textarea id="desc" class="task-input" data-f="desc" maxlength="1000" aria-describedby="err-desc" aria-invalid="${!!S.errors.desc}" placeholder="${s.ph}">${esc(w.desc)}</textarea></div>${error('desc')}
 <div class="sec"><b>Фото</b><small role="status">${(w.photos||[]).length?'Добавлено: '+w.photos.length+' из 5':'необязательно · до 5'}</small></div><p class="error" id="photo-error" role="alert">${esc(S.photoError)}</p><div class="photo-grid">${(w.photos||[]).map((p,i)=>`<div class="photo-item"><img src="${p.url}" alt="Фото ${i+1}"><button data-a="remove-photo" data-v="${i}" aria-label="Удалить фото ${i+1}">${ic('x')}</button></div>`).join('')}${(w.photos||[]).length<5?`<label class="photo-add" for="photo-input" role="button" tabindex="0" aria-disabled="${S.preparing}">${ic('cam')}<span>${S.preparing?'Подготовка…':'Добавить'}</span></label>`:''}</div>`;
 if(S.step===1)return bar+`<div class="hd"><h1>${s.mv?'Откуда и куда?':'Куда приехать?'}</h1><p class="sub">Адрес и удобное время.</p></div>
 ${addressField('addr',s.mv?'Адрес погрузки':'Адрес','Улица, дом, населённый пункт')}${conditions('',s.mv?'На погрузке':'Условия на месте')}
 ${s.mv?addressField('to','Адрес выгрузки','Улица, дом, населённый пункт')+conditions('to','На выгрузке'):''}
 <div class="card conditions" style="margin-top:10px"><div class="rw"><span>Нужна разборка</span><button class="sw" role="switch" aria-checked="${w.dis}" aria-label="Нужна разборка" data-a="tgl" data-k="dis"></button></div></div>
 <div class="sec"><b>Когда удобно?</b><small>Можно уточнить позже</small></div>${error('date')}
 <div class="days"><button class="day" style="width:103px" data-a="day" data-v="" aria-pressed="${!w.date}"><small>Уточним</small><b style="font-size:14px">Позже</b></button>${Array.from({length:5},(_,i)=>plus(i)).map((d,i)=>`<button class="day" data-a="day" data-v="${iso(d)}" aria-pressed="${iso(d)===w.date}"><small>${i===0?'Сегодня':i===1?'Завтра':d.toLocaleDateString('ru-RU',{weekday:'short'})}</small><b>${d.getDate()}</b></button>`).join('')}</div>
 <button class="fld" data-a="sheet" data-v="cal">${ic('cal')}<span class="v">${w.date?esc(fd(w.date)):'Выбрать другую дату'}</span>${ic('chev')}</button>
 ${w.date?`<div class="slots">${SLOTS.map((t,i)=>`<button class="slot" data-a="slot" data-v="${i}" aria-pressed="${i===w.slot}">${ic(t[2])}<span><b>${t[0]}</b><small>${t[1]}</small></span></button>`).join('')}</div>`:''}`;
 return bar+`<div class="hd"><h1>Контакт</h1><p class="sub">Для согласования стоимости.</p></div>
 <label class="field-label" for="phone">Телефон</label><div class="fld ${S.errors.phone?'invalid':''}">${ic('phone')}<input id="phone" data-f="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="25" aria-describedby="err-phone" aria-invalid="${!!S.errors.phone}" placeholder="+375 __ ___-__-__" value="${esc(w.phone)}"></div>${error('phone')}
 <label class="field-label" for="name">Имя <span style="font-weight:400;color:var(--mut)">· необязательно</span></label><div class="fld">${ic('user')}<input id="name" data-f="name" autocomplete="given-name" maxlength="60" placeholder="Как к вам обращаться" value="${esc(w.name)}"></div>
 <div class="sec"><b>Ваша задача</b><button class="review-edit" data-a="edit" data-v="0">Изменить</button></div>${ticket(w)}
 <p class="error" role="alert">${esc(S.submitError)}</p>${API_BASE?'':'<p class="fine">Демо-режим: отправка ещё не подключена.</p>'}`;
}
function ticket(w){const s=sv(w.sv);const rows=[['Услуга',s.n],['Задача',w.desc||'Без описания'],...((w.photos?.length||w.photoCount)?[['Фото',String(w.photos?.length||w.photoCount)+' шт.']]:[]),['Адрес',w.addr],['Условия',`${w.floor} этаж, ${w.lift?'есть лифт':'без лифта'}`],...(s.mv?[['Куда',w.to],['На выгрузке',`${w.toFloor} этаж, ${w.toLift?'есть лифт':'без лифта'}`]]:[]),...(w.dis?[['Разборка','Нужна']]:[]),['Когда',fd(w.date)+(w.date&&w.slot?', '+SLOTS[w.slot][0].toLowerCase():'')]];return `<div class="ticket">${rows.map(([a,b])=>`<div class="r"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}<div class="r tot"><span>Стоимость</span><b style="font-size:16px">После оценки</b></div></div>`}
const ORDER_STATES={
 received:{title:'Получена',text:'Заявка доставлена. Менеджер скоро возьмёт её на оценку.'},
 processing:{title:'На оценке',text:'Менеджер уточняет детали и рассчитывает стоимость.'},
 confirmed:{title:'Заказ подтверждён',text:'Стоимость и время согласованы с вами.'},
 completed:{title:'Выполнен',text:'Работа завершена. Спасибо, что выбрали нас!'},
 cancelled:{title:'Отменён',text:'Заказ отменён.'}
};
const statusOf=o=>ORDER_STATES[o.businessStatus]||ORDER_STATES.received;
const statusTime=t=>t?new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
function orderProgress(o){
 const state=o.businessStatus||'received',meta=statusOf(o);
 const keys=['received','processing','confirmed','completed'],current=keys.indexOf(state);

 app.addEventListener('touchend',e=>{
  if(!drag||drag.settling)return;
  if(![...e.changedTouches].some(t=>t.identifier===drag.id))return;
  if(!drag.active){cancel();return}
  if(e.cancelable)e.preventDefault();
  finish(commitEdgeBack(drag.distance,drag.width));
 },{passive:false});
 app.addEventListener('touchcancel',()=>{if(drag?.active&&!drag.settling)finish(false);else cancel()},{passive:true});
 app.addEventListener('click',e=>{if(performance.now()<suppressUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
 window.addEventListener('resize',cancel);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel()});
 return {cancel};
})();
$('#photo-input').addEventListener('change',e=>{
 const files=Array.from(e.currentTarget.files||[]);e.currentTarget.value='';
 if(files.length)return addPhotos(files);
});
document.addEventListener('click',e=>{if(e.target.closest('.photo-add')&&(S.preparing||S.sending))e.preventDefault()},true);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.photo-add')&&!S.preparing&&!S.sending){e.preventDefault();$('#photo-input').click()}});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(f&&S.w){S.w[f]=e.target.value;if(S.errors[f]){delete S.errors[f];$('#err-'+f).textContent='';e.target.setAttribute('aria-invalid','false');e.target.closest('.fld')?.classList.remove('invalid')}refresh()}});
document.addEventListener('keydown',e=>{if(!S.sheet)return;if(e.key==='Escape')return close();if(e.key==='Tab'){const items=[...document.querySelectorAll('#sheet button:not(:disabled), #sheet a')];const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lastStatusFetch=0;scheduleStatuses()});
if(inTg)tg.onEvent('activated',()=>{lastStatusFetch=0;scheduleStatuses()});
render();
</script>
</body>
